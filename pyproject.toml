[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokscope"
version = "0.2.0"
description = "Measure how efficiently LLM tokenizers handle your language: fertility, UNK rate, byte-token rate, and token premium across HuggingFace, tiktoken, and SentencePiece tokenizers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ravindu Pabasara Karunarathna", email = "karurpabe@gmail.com"}
]
maintainers = [
    {name = "Ravindu Pabasara Karunarathna", email = "karurpabe@gmail.com"}
]
keywords = ["tokenizer", "llm", "fertility", "low-resource languages", "nlp", "benchmark", "sinhala"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tokscope = "tokscope.cli:main"

[project.urls]
Homepage = "https://github.com/RavinduPabasara/tokscope"
Documentation = "https://github.com/RavinduPabasara/tokscope#readme"
Repository = "https://github.com/RavinduPabasara/tokscope"
"Bug Tracker" = "https://github.com/RavinduPabasara/tokscope/issues"

[project.optional-dependencies]
hf = ["transformers"]
tiktoken = ["tiktoken"]
sp = ["sentencepiece"]
all = ["transformers", "tiktoken", "sentencepiece"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.10",
    "build",
    "twine",
    "sentencepiece",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tokscope*"]

[tool.setuptools.package-data]
tokscope = ["py.typed"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional backends, not installed in the core environment
module = ["transformers", "tiktoken", "sentencepiece"]
ignore_missing_imports = true
